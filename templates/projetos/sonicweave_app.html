<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicWeave | App</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: #141418;
            --accent: #ff0055;
            --accent-cyan: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #888890;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo span {
            background: linear-gradient(90deg, var(--accent), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #ff1a66;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .btn-record {
            background: rgba(255, 0, 85, 0.1);
            color: var(--accent);
            border-color: rgba(255, 0, 85, 0.3);
        }

        .btn-record.recording {
            background: var(--accent);
            color: #fff;
            animation: pulseRecord 1.5s infinite;
        }

        @keyframes pulseRecord {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        .workspace {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .main-col {
            display: flex;
            flex-direction: column;
            flex: 3;
            gap: 2rem;
        }

        .side-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .top-panels {
            display: flex;
            gap: 2rem;
            height: 300px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Controls Panel */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            flex: 1;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        select.synth-select {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: var(--accent-cyan);
            padding: 0.5rem;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            outline: none;
            width: 100%;
        }

        /* Oscilloscope Canvas */
        .visualizer-panel {
            flex: 2;
            position: relative;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        #oscilloscope {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Piano Keyboard */
        .keyboard-panel {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .keyboard {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        .key {
            flex: 1;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .key:hover { background: #f0f0f0; }
        .key.active { background: var(--accent-cyan); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        .key.black {
            background: #111;
            width: 6%;
            height: 60%;
            position: absolute;
            z-index: 2;
            margin-left: -3%;
            border-radius: 0 0 4px 4px;
            border: 1px solid #000;
        }

        .key.black:hover { background: #222; }
        .key.black.active { background: var(--accent); }

        .key.black:nth-child(2) { left: 14.28%; }
        .key.black:nth-child(4) { left: 28.56%; }
        .key.black:nth-child(7) { left: 57.12%; }
        .key.black:nth-child(9) { left: 71.4%; }
        .key.black:nth-child(11) { left: 85.68%; }

        /* Recordings Panel */
        .recordings-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        .recording-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .recording-item audio {
            width: 100%;
            height: 30px;
            outline: none;
        }

        /* Custom Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 400px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: #fff;
            padding: 0.8rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 1.5rem;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent-cyan);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Init Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .power-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-family: 'Space Mono', monospace;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .power-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-cyan);
            color: #000;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

    <!-- Init Overlay -->
    <div class="overlay" id="initOverlay">
        <div style="text-align: center;">
            <h2 style="margin-bottom: 2rem; font-weight: 800;">System Offline</h2>
            <button class="power-btn" onclick="initAudio()">Power On Engine</button>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="presetModalOverlay">
        <div class="modal">
            <h2 class="modal-title">Save Preset</h2>
            <input type="text" id="presetNameInput" class="modal-input" placeholder="e.g. Cyberpunk Bass" autocomplete="off">
            <div class="modal-actions">
                <button class="btn" onclick="closeModal('presetModalOverlay')">Cancel</button>
                <button class="btn btn-primary" onclick="confirmSavePreset()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="recordingModalOverlay">
        <div class="modal">
            <h2 class="modal-title">Save Recording</h2>
            <input type="text" id="recordingNameInput" class="modal-input" placeholder="e.g. My Awesome Melody" autocomplete="off">
            <div class="modal-actions">
                <button class="btn" onclick="discardRecording()">Discard</button>
                <button class="btn btn-primary" onclick="confirmSaveRecording()">Upload & Save</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <a href="/projetos/sonicweave" class="logo">Sonic<span>Weave</span></a>
        <div class="header-actions">
            <button class="btn btn-record" id="recordBtn" onclick="toggleRecording()">
                <span id="recordDot">🔴</span> <span id="recordText">Record</span>
            </button>
            <div style="width: 1px; height: 20px; background: var(--border); margin: 0 10px;"></div>
            <select id="presetSelect" class="synth-select" style="width: 200px;" onchange="loadSelectedPreset()">
                <option value="">Default Preset</option>
            </select>
            <button class="btn" onclick="openSavePresetModal()">Save Preset</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
        
        <!-- Left: Synth Engine -->
        <div class="main-col">
            <div class="top-panels">
                <div class="panel" style="flex: 1;">
                    <div class="panel-title">Oscillator & Filter</div>
                    <div class="controls-grid">
                        <div class="control-group">
                            <label class="control-label">Waveform</label>
                            <select id="waveType" class="synth-select" onchange="updateSynth()">
                                <option value="sawtooth">Sawtooth</option>
                                <option value="square">Square</option>
                                <option value="sine">Sine</option>
                                <option value="triangle">Triangle</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">Filter Cutoff</label>
                            <input type="range" id="filterCutoff" min="100" max="10000" value="2000" oninput="updateSynth()">
                        </div>
                        <div class="control-group">
                            <label class="control-label">Master Volume</label>
                            <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.5" oninput="updateSynth()">
                        </div>
                    </div>
                </div>

                <div class="visualizer-panel">
                    <canvas id="oscilloscope"></canvas>
                </div>
            </div>

            <div class="keyboard-panel">
                <div class="keyboard" id="keyboard">
                    <!-- Keys generated by JS -->
                </div>
            </div>
            <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; font-family: 'Space Mono', monospace;">
                Press A, S, D, F, G, H, J, K on your keyboard or click the keys.
            </div>
        </div>

        <!-- Right: Gallery -->
        <div class="side-col">
            <div class="panel" style="flex: 1;">
                <div class="panel-title">
                    Recordings Library
                    <span style="font-size: 1.2rem;">📼</span>
                </div>
                <div class="recordings-list" id="recordingsList">
                    <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 2rem;">
                        No recordings yet. Hit the record button!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Saved!</div>

    <script>
        let audioCtx;
        let masterGain;
        let filter;
        let analyser;
        let dest;
        let mediaRecorder;
        let audioChunks = [];
        let currentRecordingBlob = null;
        let isRecording = false;

        let canvas, canvasCtx;
        let activeOscillators = {};

        // Notes C4 to C5
        const notes = [
            { note: 'C4', freq: 261.63, type: 'white', key: 'a' },
            { note: 'C#4', freq: 277.18, type: 'black', key: 'w' },
            { note: 'D4', freq: 293.66, type: 'white', key: 's' },
            { note: 'D#4', freq: 311.13, type: 'black', key: 'e' },
            { note: 'E4', freq: 329.63, type: 'white', key: 'd' },
            { note: 'F4', freq: 349.23, type: 'white', key: 'f' },
            { note: 'F#4', freq: 369.99, type: 'black', key: 't' },
            { note: 'G4', freq: 392.00, type: 'white', key: 'g' },
            { note: 'G#4', freq: 415.30, type: 'black', key: 'y' },
            { note: 'A4', freq: 440.00, type: 'white', key: 'h' },
            { note: 'A#4', freq: 466.16, type: 'black', key: 'u' },
            { note: 'B4', freq: 493.88, type: 'white', key: 'j' },
            { note: 'C5', freq: 523.25, type: 'white', key: 'k' }
        ];

        function initAudio() {
            document.getElementById('initOverlay').style.display = 'none';
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            masterGain = audioCtx.createGain();
            filter = audioCtx.createBiquadFilter();
            analyser = audioCtx.createAnalyser();
            dest = audioCtx.createMediaStreamDestination();

            analyser.fftSize = 2048;

            // Audio Graph:
            // Osc -> Filter -> MasterGain -> Analyser -> Destination (Speakers)
            //                            |-> MediaStreamDestination (Recording)
            filter.connect(masterGain);
            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);
            masterGain.connect(dest); // Connect to recorder dest

            updateSynth();
            setupCanvas();
            drawOscilloscope();
            fetchPresets();
            fetchRecordings();
        }

        function updateSynth() {
            if(!audioCtx) return;
            const vol = document.getElementById('masterVol').value;
            const cutoff = document.getElementById('filterCutoff').value;
            
            masterGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
            filter.type = 'lowpass';
            filter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.05);
        }

        function playNote(freq, noteId) {
            if (!audioCtx || activeOscillators[noteId]) return;

            const osc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();

            osc.type = document.getElementById('waveType').value;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Envelope (Attack/Release)
            noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
            noteGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);

            osc.connect(noteGain);
            noteGain.connect(filter);

            osc.start();
            activeOscillators[noteId] = { osc, noteGain };
            
            const keyEl = document.getElementById('key-' + noteId);
            if(keyEl) keyEl.classList.add('active');
        }

        function stopNote(noteId) {
            if (!activeOscillators[noteId]) return;

            const { osc, noteGain } = activeOscillators[noteId];
            
            // Release
            noteGain.gain.cancelScheduledValues(audioCtx.currentTime);
            noteGain.gain.setValueAtTime(noteGain.gain.value, audioCtx.currentTime);
            noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            osc.stop(audioCtx.currentTime + 0.3);
            delete activeOscillators[noteId];

            const keyEl = document.getElementById('key-' + noteId);
            if(keyEl) keyEl.classList.remove('active');
        }

        // Setup Keyboard UI
        const kbContainer = document.getElementById('keyboard');
        notes.forEach(n => {
            const key = document.createElement('div');
            key.className = `key ${n.type}`;
            key.id = 'key-' + n.note;
            
            key.addEventListener('mousedown', () => playNote(n.freq, n.note));
            key.addEventListener('mouseup', () => stopNote(n.note));
            key.addEventListener('mouseleave', () => stopNote(n.note));
            
            kbContainer.appendChild(key);
        });

        // Keyboard mapping
        const keyMap = {};
        notes.forEach(n => keyMap[n.key] = n);

        window.addEventListener('keydown', e => {
            if (e.repeat) return;
            const n = keyMap[e.key.toLowerCase()];
            if (n) playNote(n.freq, n.note);
        });

        window.addEventListener('keyup', e => {
            const n = keyMap[e.key.toLowerCase()];
            if (n) stopNote(n.note);
        });

        // Oscilloscope Canvas
        function setupCanvas() {
            canvas = document.getElementById('oscilloscope');
            canvasCtx = canvas.getContext('2d');
            const resize = () => {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            };
            window.addEventListener('resize', resize);
            resize();
        }

        function drawOscilloscope() {
            requestAnimationFrame(drawOscilloscope);
            if(!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#0a0a0c';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = 'var(--accent-cyan)';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;

                if(i === 0) { canvasCtx.moveTo(x, y); } 
                else { canvasCtx.lineTo(x, y); }
                x += sliceWidth;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 15;
            canvasCtx.shadowColor = 'var(--accent-cyan)';
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;
        }

        // --- Modals Logic ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openSavePresetModal() {
            document.getElementById('presetNameInput').value = '';
            openModal('presetModalOverlay');
            setTimeout(() => document.getElementById('presetNameInput').focus(), 100);
        }

        // --- Presets Logic ---
        let presets = [];
        async function fetchPresets() {
            try {
                const res = await fetch('/api/sonicweave/presets');
                presets = await res.json();
                const select = document.getElementById('presetSelect');
                select.innerHTML = '<option value="">Default Preset</option>';
                presets.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    select.appendChild(opt);
                });
            } catch(e) { console.error(e); }
        }

        async function confirmSavePreset() {
            const name = document.getElementById('presetNameInput').value.trim();
            if(!name) return;

            const settings = {
                waveType: document.getElementById('waveType').value,
                filterCutoff: document.getElementById('filterCutoff').value,
                masterVol: document.getElementById('masterVol').value
            };

            try {
                const res = await fetch('/api/sonicweave/presets', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, settings })
                });
                if(res.ok) {
                    closeModal('presetModalOverlay');
                    showToast('Preset Saved!');
                    fetchPresets();
                }
            } catch(e) { console.error(e); }
        }

        function loadSelectedPreset() {
            const id = document.getElementById('presetSelect').value;
            if(!id) return; 
            const p = presets.find(x => x.id == id);
            if(p && p.settings) {
                document.getElementById('waveType').value = p.settings.waveType || 'sawtooth';
                document.getElementById('filterCutoff').value = p.settings.filterCutoff || 2000;
                document.getElementById('masterVol').value = p.settings.masterVol || 0.5;
                updateSynth();
            }
        }

        // --- Recording Logic ---
        function toggleRecording() {
            if(!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            if(!dest) return;
            audioChunks = [];
            // Use standard webm mime type
            mediaRecorder = new MediaRecorder(dest.stream);
            
            mediaRecorder.ondataavailable = e => {
                if(e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                currentRecordingBlob = new Blob(audioChunks, { type: 'audio/webm' });
                document.getElementById('recordingNameInput').value = '';
                openModal('recordingModalOverlay');
                setTimeout(() => document.getElementById('recordingNameInput').focus(), 100);
            };

            mediaRecorder.start();
            isRecording = true;
            
            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording');
            document.getElementById('recordText').innerText = 'Stop';
            document.getElementById('recordDot').innerText = '⏹';
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            document.getElementById('recordText').innerText = 'Record';
            document.getElementById('recordDot').innerText = '🔴';
        }

        function discardRecording() {
            currentRecordingBlob = null;
            audioChunks = [];
            closeModal('recordingModalOverlay');
        }

        async function confirmSaveRecording() {
            const name = document.getElementById('recordingNameInput').value.trim() || 'Untitled Recording';
            if(!currentRecordingBlob) return;

            const formData = new FormData();
            formData.append('audio', currentRecordingBlob, 'recording.webm');
            formData.append('name', name);

            const btn = document.querySelector('#recordingModalOverlay .btn-primary');
            btn.innerText = 'Uploading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/sonicweave/recordings', {
                    method: 'POST',
                    body: formData
                });
                if(res.ok) {
                    closeModal('recordingModalOverlay');
                    showToast('Recording Saved to Server!');
                    fetchRecordings();
                }
            } catch(e) {
                console.error(e);
                alert("Upload failed.");
            } finally {
                btn.innerText = 'Upload & Save';
                btn.disabled = false;
            }
        }

        // --- Fetch & Render Recordings Gallery ---
        async function fetchRecordings() {
            try {
                const res = await fetch('/api/sonicweave/recordings');
                const data = await res.json();
                
                const list = document.getElementById('recordingsList');
                if(data.length === 0) {
                    list.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 2rem;">No recordings yet. Hit the record button!</div>';
                    return;
                }
                
                list.innerHTML = '';
                data.forEach(r => {
                    const item = document.createElement('div');
                    item.className = 'recording-item';
                    
                    const date = new Date(r.created_at).toLocaleString();
                    
                    item.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="font-size: 0.9rem;">${r.name}</strong>
                            <a href="${r.filepath}" download style="color: var(--accent-cyan); text-decoration: none; font-size: 0.8rem;">Download</a>
                        </div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.5rem;">${date}</div>
                        <audio controls src="${r.filepath}"></audio>
                    `;
                    list.appendChild(item);
                });
            } catch(e) { console.error(e); }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

    </script>
</body>
</html>
